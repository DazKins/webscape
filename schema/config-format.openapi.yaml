openapi: 3.1.0
info:
  title: Webscape Startup Config Format
  version: 0.1.0
  description: Runtime and deployment settings loaded from config.json when Webscape starts.
paths: {}
components:
  schemas:
    StartupConfig:
      type: object
      additionalProperties: false
      required:
        - formatVersion
        - server
        - client
        - game
        - streaming
        - auth
      allOf:
        - if:
            properties:
              server:
                required: [devMode]
                properties:
                  devMode:
                    const: true
          else:
            properties:
              auth:
                properties:
                  mode:
                    enum: [oidc]
                  issuer:
                    pattern: '^https://'
                  publicUrl:
                    pattern: '^https://'
      properties:
        formatVersion:
          type: integer
          const: 1
        server:
          type: object
          additionalProperties: false
          required: [address]
          properties:
            devMode:
              type: boolean
              default: false
              description: Disable frontend caching and permit HTTP loopback OIDC URLs for local development; authentication is still required.
            tickIntervalMs:
              type: integer
              minimum: 1
              maximum: 60000
              default: 500
              description: Authoritative simulation step in milliseconds; 500 runs twice per second. Omitted values default to 500.
            address:
              type: string
              minLength: 1
              examples: [":8080"]
        client:
          type: object
          additionalProperties: false
          required: [folder]
          properties:
            folder:
              type: string
              minLength: 1
              examples: [client/dist]
        game:
          type: object
          additionalProperties: false
          required: [folder]
          properties:
            folder:
              type: string
              minLength: 1
              examples: [game-project]
        streaming:
          type: object
          additionalProperties: false
          required: [chunkRadius]
          properties:
            chunkRadius:
              type: integer
              minimum: 1
              description: Square chunk radius streamed around each player.
        auth:
          $ref: '#/components/schemas/AuthConfig'
        persistence:
          $ref: '#/components/schemas/PersistenceConfig'
    PersistenceConfig:
      type: object
      additionalProperties: false
      properties:
        driver:
          type: string
          enum: [none, postgres]
          default: none
          description: Independent of server.devMode. PostgreSQL failures never fall back to none.
        worldKey:
          type: string
          minLength: 1
          default: default
          description: Unique saved-world namespace; only one running server may own this key.
        timeoutSeconds:
          type: integer
          minimum: 1
          maximum: 300
          default: 10
          description: Deadline for database startup, load, save and shutdown operations.
        postgres:
          $ref: '#/components/schemas/PostgresConfig'
      allOf:
        - if:
            required: [driver]
            properties:
              driver:
                const: postgres
          then:
            required: [postgres]
            properties:
              postgres:
                anyOf:
                  - required: [connectionStringEnv]
                    properties:
                      connectionStringEnv:
                        minLength: 1
                  - required: [host, database, user]
                    properties:
                      host:
                        minLength: 1
                      database:
                        minLength: 1
                      user:
                        minLength: 1
    PostgresConfig:
      type: object
      additionalProperties: false
      description: connectionStringEnv overrides individual fields. Password and passwordEnv must not both be non-empty.
      properties:
        connectionStringEnv:
          type: string
          description: Name of an environment variable containing a PostgreSQL URL or keyword connection string. Missing or empty values fail startup.
        host:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 5432
        database:
          type: string
        user:
          type: string
        password:
          type: string
          writeOnly: true
        passwordEnv:
          type: string
          description: Name of an environment variable containing the password. Missing or empty values fail startup.
        sslMode:
          type: string
          enum: [disable, require, verify-ca, verify-full]
          default: verify-full
        sslRootCert:
          type: string
          description: Path inside the server environment to the trusted CA certificate file.
        sslCert:
          type: string
          description: Optional client certificate path.
        sslKey:
          type: string
          description: Optional client private key path.
      not:
        required: [password, passwordEnv]
        properties:
          password:
            minLength: 1
          passwordEnv:
            minLength: 1

    AuthConfig:
      type: object
      additionalProperties: false
      required: [publicUrl, sessionLifetimeSeconds]
      allOf:
        - if:
            required: [mode]
            properties:
              mode:
                const: none
          else:
            required: [issuer, clientId, clientSecretEnv]
      description: OIDC is the default. Explicit none mode permits guest play for testing with server.devMode; there is no automatic fallback.
      properties:
        mode:
          type: string
          enum: [oidc, none]
          default: oidc
          description: none requires server.devMode and creates guest sessions without contacting a provider.
        issuer:
          $ref: '#/components/schemas/AuthURL'
          description: Exact OIDC issuer; discovery supplies the authorization, token and JWKS endpoints. No query, fragment or credentials.
        clientId:
          type: string
          minLength: 1
        clientSecretEnv:
          type: string
          minLength: 1
          description: Name of the environment variable containing the OIDC client secret. Empty or missing environment values fail startup; the secret itself is never stored here.
        publicUrl:
          allOf:
            - $ref: '#/components/schemas/AuthURL'
            - pattern: '^https?://[^/?#@]+/?$'
          description: Browser-facing origin, with an optional trailing slash and no other path. Used for the exact WebSocket Origin and /auth/callback URL; independent of the listen address.
        sessionLifetimeSeconds:
          type: integer
          minimum: 60
          maximum: 86400
          description: Absolute session lifetime, additionally capped by ID-token expiry. Sessions end on server restart.
    AuthURL:
      type: string
      format: uri
      description: HTTPS is required in production. With server.devMode true, HTTP loopback URLs are also allowed; use localhost, canonical 127.x.x.x addresses or [::1]. Credentials, queries and fragments are forbidden.
      pattern: '^(https://[^/?#@]+|http://(localhost|127(\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}|\[::1\])(:[0-9]+)?)(/[^?#]*)?$'

openapi: 3.1.0
info:
  title: Webscape Startup Config Format
  version: 0.1.0
  description: Runtime and deployment settings loaded from config.json when Webscape starts.
paths: {}
components:
  schemas:
    StartupConfig:
      type: object
      additionalProperties: false
      required:
        - formatVersion
        - server
        - client
        - game
        - streaming
      properties:
        formatVersion:
          type: integer
          const: 1
        server:
          type: object
          additionalProperties: false
          required: [address]
          properties:
            tickIntervalMs:
              type: integer
              minimum: 1
              maximum: 60000
              default: 500
              description: Authoritative simulation step in milliseconds; 500 runs twice per second. Omitted values default to 500.
            address:
              type: string
              minLength: 1
              examples: [":8080"]
        client:
          type: object
          additionalProperties: false
          required: [folder]
          properties:
            folder:
              type: string
              minLength: 1
              examples: [client/dist]
        game:
          type: object
          additionalProperties: false
          required: [folder]
          properties:
            folder:
              type: string
              minLength: 1
              examples: [game-project]
        streaming:
          type: object
          additionalProperties: false
          required: [chunkRadius]
          properties:
            chunkRadius:
              type: integer
              minimum: 1
              description: Square chunk radius streamed around each player.

openapi: 3.1.0
info:
  title: Webscape Game Project Format
  version: 0.1.0
  description: |
    Schema for the root `game.json` manifest used by the Webscape editor.

    The manifest is the entry point for a folder-based game project. It lists
    the source JSON files that make up the game, such as chunks, conversations,
    and quests.
paths: {}
components:
  schemas:
    GameProjectFormat:
      type: object
      additionalProperties: false
      required:
        - formatVersion
        - id
        - world
        - files
      properties:
        formatVersion:
          type: integer
          const: 2
          description: Version of this game project document format.
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]*$"
          examples:
            - starter_game
        displayName:
          type: string
          examples:
            - Starter Game
        mana:
          $ref: "#/components/schemas/ManaSettings"
        world:
          $ref: "#/components/schemas/GameWorld"
        files:
          $ref: "#/components/schemas/GameProjectFiles"

    ManaSettings:
      type: object
      additionalProperties: false
      description: |
        Optional mana tuning; omitted settings use 100 maximum mana, 10 per staff
        cast, and 1 regenerated every 2 server ticks. If supplied, all fields are
        required. Staff cast cost and regeneration amount must not exceed maxMana.
        Maximum mana applies to new players, resets, and legacy save migration;
        existing saved mana is preserved. Regeneration includes combat, but only
        active, living entities regenerate. Respawning players restore full mana.
      required: [maxMana, staffCastCost, regenAmount, regenIntervalTicks]
      properties:
        maxMana: { type: integer, minimum: 1, maximum: 2147483647, default: 100 }
        staffCastCost: { type: integer, minimum: 1, maximum: 2147483647, default: 10 }
        regenAmount: { type: integer, minimum: 1, maximum: 2147483647, default: 1 }
        regenIntervalTicks: { type: integer, minimum: 1, maximum: 2147483647, default: 2 }

    GameProjectFiles:
      type: object
      additionalProperties: false
      required:
        - chunks
        - conversations
        - quests
      properties:
        chunks:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ProjectFilePath"
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/ProjectFilePath"
        quests:
          type: array
          items:
            $ref: "#/components/schemas/ProjectFilePath"

    GameWorld:
      type: object
      additionalProperties: false
      required:
        - chunkSize
      properties:
        chunkSize:
          $ref: "#/components/schemas/ChunkSize"

    ChunkSize:
      type: object
      additionalProperties: false
      required: [x, y]
      properties:
        x: { type: integer, minimum: 1 }
        y: { type: integer, minimum: 1 }

    ProjectFilePath:
      type: string
      pattern: "^(?!/)(?!.*(?:^|/)\\.\\.?(/|$))(?!.*\\\\)(?!.*//).+[^/]$"
      examples:
        - chunks/starter.json
        - conversations/starter-conversations.json
        - quests/tutorial.json

  examples:
    StarterGame:
      summary: A small folder-based game project.
      value:
        formatVersion: 2
        id: starter_game
        displayName: Starter Game
        mana: { maxMana: 100, staffCastCost: 10, regenAmount: 1, regenIntervalTicks: 2 }
        world:
          chunkSize: { x: 32, y: 32 }
        files:
          chunks:
            - chunks/starter.json
          conversations:
            - conversations/starter-conversations.json
          quests: []

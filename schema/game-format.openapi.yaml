openapi: 3.1.0
info:
  title: Webscape Game Project Format
  version: 0.1.0
  description: |
    Schema for the root `game.json` manifest used by the Webscape editor.

    The manifest is the entry point for a folder-based game project. It lists
    the source JSON files that make up the game, such as chunks, conversations,
    and quests.
paths: {}
components:
  schemas:
    GameProjectFormat:
      type: object
      additionalProperties: false
      required:
        - formatVersion
        - id
        - world
        - files
      properties:
        formatVersion:
          type: integer
          const: 2
          description: Version of this game project document format.
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]*$"
          examples:
            - starter_game
        displayName:
          type: string
          examples:
            - Starter Game
        world:
          $ref: "#/components/schemas/GameWorld"
        files:
          $ref: "#/components/schemas/GameProjectFiles"

    GameProjectFiles:
      type: object
      additionalProperties: false
      required:
        - chunks
        - conversations
        - quests
      properties:
        chunks:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ProjectFilePath"
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/ProjectFilePath"
        quests:
          type: array
          items:
            $ref: "#/components/schemas/ProjectFilePath"

    GameWorld:
      type: object
      additionalProperties: false
      required:
        - chunkSize
      properties:
        chunkSize:
          $ref: "#/components/schemas/ChunkSize"

    ChunkSize:
      type: object
      additionalProperties: false
      required: [x, y]
      properties:
        x: { type: integer, minimum: 1 }
        y: { type: integer, minimum: 1 }

    ProjectFilePath:
      type: string
      pattern: "^(?!/)(?!.*(?:^|/)\\.\\.?(/|$))(?!.*\\\\)(?!.*//).+[^/]$"
      examples:
        - chunks/starter.json
        - conversations/starter-conversations.json
        - quests/tutorial.json

  examples:
    StarterGame:
      summary: A small folder-based game project.
      value:
        formatVersion: 2
        id: starter_game
        displayName: Starter Game
        world:
          chunkSize: { x: 32, y: 32 }
        files:
          chunks:
            - chunks/starter.json
          conversations:
            - conversations/starter-conversations.json
          quests: []

openapi: 3.1.0
info:
  title: Webscape Chunk Format
  version: 0.1.0
  description: |
    Schema for authoring fixed-size Webscape chunks. Chunk coordinates may be negative;
    tile, wall, and entity positions are local to the chunk.

    Tile arrays use row-major order. Given a local tile coordinate (x, y), its
    index is `y * chunkSize.x + x`. The uniform chunk size comes from game.json.
paths: {}
components:
  schemas:
    WorldFormat:
      type: object
      additionalProperties: false
      required:
        - formatVersion
        - id
        - coordinate
        - terrain
        - heights
        - blockers
        - walls
        - entities
      properties:
        formatVersion:
          type: integer
          const: 2
          description: Version of this world document format.
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]*$"
          examples:
            - starter
        displayName:
          type: string
          examples:
            - Starter Island
        coordinate:
          $ref: "#/components/schemas/ChunkCoordinate"
        terrain:
          type: array
          description: |
            Flat row-major terrain layer. Coordinate (x, y) is stored at
            `terrain[y * chunkSize.x + x]`. Its exact length is defined by game.json.
          items:
            $ref: "#/components/schemas/TerrainType"
        heights:
          type: array
          description: |
            Required flat row-major terrain height layer. Coordinate (x, y) is
            stored at `heights[y * chunkSize.x + x]`. Each value must be an integer
            from 0 through 10.
          items:
            type: integer
            minimum: 0
            maximum: 10
        blockers:
          type: array
          description: |
            Optional flat row-major invisible blocker layer. Coordinate (x, y)
            is stored at `blockers[y * chunkSize.x + x]`. `true` blocks movement.
          items:
            type: boolean
        walls:
          type: array
          description: Visible wall objects that are rendered above tiles and block movement.
          default: []
          items:
            $ref: "#/components/schemas/WorldWall"
        entities:
          type: array
          description: Authored map entities. Each entity is defined by component JSON parsed into ECS components.
          default: []
          items:
            $ref: "#/components/schemas/WorldEntity"

    ChunkCoordinate:
      type: object
      additionalProperties: false
      required:
        - x
        - y
      properties:
        x:
          type: integer
          examples:
            - -2
        y:
          type: integer
          examples:
            - 3

    TerrainType:
      type: string
      description: Freeform tile terrain identifier, such as `grass`, `road`, or `water`.

    WorldEntity:
      type: object
      additionalProperties: false
      required:
        - id
        - components
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]*$"
          examples:
            - chest_001
        components:
          $ref: "#/components/schemas/EntityComponents"

    EntityComponents:
      type: object
      description: Freeform authored ECS component data, keyed by component id.
      additionalProperties: true
      properties:
        renderable:
          $ref: "#/components/schemas/RenderableComponent"
        openable:
          $ref: "#/components/schemas/OpenableComponent"
        randomwalk:
          $ref: "#/components/schemas/RandomWalkComponent"
        woodcuttable:
          $ref: "#/components/schemas/WoodcuttableComponent"
        fishable:
          $ref: "#/components/schemas/FishableComponent"

    RenderableComponent:
      type: object
      additionalProperties: true
      required:
        - type
      properties:
        type:
          type: string
          description: Renderer type, such as `door`, `chest`, or `human`.
        orientation:
          type: string
          enum:
            - north
            - east
            - south
            - west
          default: north
          description: Optional visual rotation for tile-aligned renderers.

    OpenableComponent:
      type: object
      additionalProperties: false
      properties:
        isOpen:
          type: boolean
          default: false
          description: Whether the entity starts open. Missing or false starts closed.

    RandomWalkComponent:
      type: object
      additionalProperties: false
      properties:
        walkTimer:
          type: integer
          default: 10
          description: Initial ticks before the entity attempts a random walk step.
        maxDistance:
          type: integer
          minimum: 0
          default: 5
          description: Maximum Manhattan distance the entity may random walk from its spawn position.

    WoodcuttableComponent:
      type: object
      additionalProperties: false
      required:
        - maxDurability
        - respawnTicks
        - yield
      properties:
        maxDurability:
          type: integer
          minimum: 1
          description: Durability restored whenever the resource regrows.
        respawnTicks:
          type: integer
          minimum: 1
          description: Number of full server ticks the depleted resource remains a stump.
        yield:
          $ref: "#/components/schemas/MaterialYield"

    MaterialYield:
      type: object
      additionalProperties: false
      required:
        - name
        - type
        - count
      properties:
        name:
          type: string
          minLength: 1
        type:
          type: string
          const: material
        count:
          type: integer
          minimum: 1

    FishableComponent:
      type: object
      additionalProperties: false
      required:
        - catchChancePercent
        - yield
      properties:
        catchChancePercent:
          type: integer
          minimum: 1
          maximum: 100
          description: Percent chance that each server-tick fishing attempt catches the yield.
        yield:
          $ref: "#/components/schemas/FishingYield"

    FishingYield:
      type: object
      additionalProperties: false
      required:
        - name
        - type
        - count
      properties:
        name:
          type: string
          pattern: ".*\\S.*"
        type:
          type: string
          pattern: ".*\\S.*"
        count:
          type: integer
          minimum: 1

    WorldWall:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - x
        - y
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]*$"
          examples:
            - wall_001
        type:
          type: string
          description: Freeform wall type identifier, such as `stone` or `wood`.
        x:
          type: integer
          minimum: 0
        y:
          type: integer
          minimum: 0

  examples:
    TinyWorld:
      summary: A 3 by 2 world using flat row-major tile arrays.
      value:
        formatVersion: 2
        id: starter
        displayName: Starter Island
        coordinate:
          x: 0
          y: 0
        terrain:
          - grass
          - grass
          - road
          - water
          - grass
          - road
        heights:
          - 0
          - 0
          - 0
          - 0
          - 0
          - 0
        blockers:
          - false
          - false
          - false
          - true
          - false
          - false
        walls:
          - id: wall_001
            type: stone
            x: 2
            y: 0
        entities:
          - id: player_spawn
            components:
              position:
                x: 0
                y: 0
              playerSpawn: {}
          - id: chest_001
            components:
              position:
                x: 0
                y: 1
              metadata:
                name: chest_001
                type: chest
                width: 1
                height: 1
                blocksMovement: true
              renderable:
                type: chest
              lootable:
                once: true
                items:
                  - name: Mysterious Key
                    type: quest
                    count: 1
          - id: tree_001
            components:
              position:
                x: 1
                y: 1
              metadata:
                objectId: tree_001
                name: tree_001
                type: tree
                width: 1
                height: 1
                blocksMovement: true
              renderable:
                type: tree
              woodcuttable:
                maxDurability: 5
                respawnTicks: 60
                yield:
                  name: Logs
                  type: material
                  count: 1
          - id: door_001
            components:
              position:
                x: 1
                y: 0
              metadata:
                name: door_001
                type: door
                width: 1
                height: 1
                blocksMovement: true
              renderable:
                type: door
                orientation: east
              openable:
                isOpen: false
          - id: fishing_spot_001
            components:
              position:
                x: 2
                y: 2
              metadata:
                objectId: fishing_spot_001
                name: Fishing Spot
                type: fishingSpot
                width: 1
                height: 1
                blocksMovement: true
              renderable:
                type: fishingSpot
              fishable:
                catchChancePercent: 5
                yield:
                  name: Raw Fish
                  type: fish
                  count: 1
          - id: bob
            components:
              position:
                x: 2
                y: 1
              metadata:
                name: Bob
                entityType: dude
              renderable:
                type: human
              conversation:
                conversationId: guide_intro
          - id: rat_spawn_001
            components:
              position:
                x: 1
                y: 1
              spawn:
                respawnTicks: 20
                entity:
                  components:
                    metadata:
                      name: Rat
                      entityType: rat
                    renderable:
                      type: human
                    randomwalk:
                      walkTimer: 10
                      maxDistance: 5
                    health:
                      maxHealth: 100
                    basestats:
                      strength: 6
                      dexterity: 5
                      vitality: 6
                    equipped: {}
                    combatstats: {}
